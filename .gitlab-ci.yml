image: python:3.13-alpine

stages:
  - validate
  - publish

validate:
  stage: validate
  only:
    - /^minecraft\/.*\/.*\/production$/
  script:
    - apk add --no-cache git
    - |
      for f in $(find datapack -name "*.json"); do
        python -c "import json,sys; json.load(open('$f'))" || { echo "INVALID JSON: $f"; exit 1; }
      done
    - python -c "import json; d=json.load(open('datapack/pack.mcmeta')); assert d['pack']['min_format']==[107,1], 'bad min_format'"
    - echo "datapack OK"

publish-public:
  stage: publish
  only:
    - /^minecraft\/.*\/.*\/production$/
  except:
    - main
  script:
    - apk add --no-cache git
    - git config user.email "ci@mods-minecraft.dev"
    - git config user.name "Mods Minecraft CI"

    # Derivar la rama main: minecraft/X/N/production → minecraft/X/N/main
    - MAIN_BRANCH=$(echo "$CI_COMMIT_BRANCH" | sed 's|/production$|/main|')
    - echo "Publishing to $MAIN_BRANCH"

    # Obtener la rama main hermana. Si no existe, falla — debe crearse manualmente.
    - |
      if ! git fetch origin "$MAIN_BRANCH" 2>/dev/null; then
        echo "ERROR: $MAIN_BRANCH no existe. Créala desde production primero."
        exit 1
      fi
    - git checkout "$MAIN_BRANCH"

    # Limpiar y copiar solo archivos públicos desde production
    - git rm -rf --ignore-unmatch --quiet . 2>/dev/null || true
    - git checkout "$CI_COMMIT_SHA" -- datapack/ docs/ scripts/ build_fix_pack.py version.txt .gitignore README.md CHANGELOG.md

    - git add -A
    - |
      if ! git diff --cached --quiet; then
        git commit -m "chore: sync public files from ${CI_COMMIT_SHORT_SHA}"
        git push --force "https://oauth2:${GITLAB_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" HEAD:"$MAIN_BRANCH"
      else
        echo "No changes to publish"
      fi
